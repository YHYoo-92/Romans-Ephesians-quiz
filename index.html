<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말씀 퀴즈 (로마서·에베소서)</title>
    <!-- Tailwind CSS 연동 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .word-keep { word-break: keep-all; overflow-wrap: break-word; }
        /* 진행률 바 애니메이션 부드럽게 */
        #progress-fill { transition: width 0.3s ease; }
    </style>
    <!-- 외부 말씀 데이터 불러오기 -->
    <script src="bible_data.js"></script>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <!-- 슬림 컴팩트 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-10 text-sm">
        <div class="max-w-4xl mx-auto">
            <!-- 프로그레스 바 -->
            <div class="h-1 bg-indigo-800 w-full">
                <div id="progress-fill" class="h-full bg-green-400 w-0"></div>
            </div>
            
            <div class="p-2 flex flex-col sm:flex-row gap-2 justify-between items-center">
                <!-- 네비게이션 드롭다운 -->
                <div class="flex gap-1 items-center w-full sm:w-auto">
                    <select id="book-select" class="bg-indigo-700 border border-indigo-500 rounded px-2 py-1 outline-none flex-1 sm:flex-none cursor-pointer">
                        <option value="로마서">로마서</option>
                        <option value="에베소서">에베소서</option>
                    </select>
                    <select id="chapter-select" class="bg-indigo-700 border border-indigo-500 rounded px-2 py-1 outline-none flex-1 sm:flex-none cursor-pointer"></select>
                    <select id="verse-select" class="bg-indigo-700 border border-indigo-500 rounded px-2 py-1 outline-none flex-1 sm:flex-none cursor-pointer"></select>
                </div>

                <!-- 토글 버튼 컨트롤 -->
                <div class="flex gap-2 w-full sm:w-auto text-xs font-medium">
                    <button id="order-toggle" class="flex-1 sm:flex-none bg-indigo-500 hover:bg-indigo-400 px-3 py-1 rounded transition-colors">
                        ➡️ 순차
                    </button>
                    <button id="mode-toggle" class="flex-1 sm:flex-none bg-indigo-500 hover:bg-indigo-400 px-3 py-1 rounded transition-colors">
                        4지선다
                    </button>
                    <button id="note-btn" class="flex-1 sm:flex-none bg-rose-500 hover:bg-rose-400 px-3 py-1 rounded transition-colors">
                        📝 오답노트
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 본문 영역 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">
        <!-- 문제 카드 -->
        <div id="quiz-card" class="bg-white rounded-xl shadow-lg p-5 sm:p-8 w-full border-t-4 border-indigo-500 relative">
            <h2 id="verse-title" class="text-indigo-600 font-bold text-base sm:text-lg mb-4 border-b pb-2">로마서 1:1</h2>
            
            <p id="verse-text" class="text-lg sm:text-xl leading-relaxed word-keep text-gray-700 min-h-[120px]">
                <!-- 문제 본문 삽입 영역 -->
            </p>

            <!-- 컨트롤 영역 -->
            <div class="mt-8 border-t pt-4">
                
                <!-- 4지선다 보기 영역 -->
                <div id="multiple-choice-area" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <!-- 버튼 동적 생성 -->
                </div>

                <!-- 주관식 입력 영역 (기본 숨김) -->
                <div id="subjective-area" class="hidden flex flex-col gap-3">
                    <div id="subjective-inputs" class="flex flex-col gap-2"></div>
                    <button id="submit-subjective" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded w-full sm:w-auto self-end transition">
                        정답 제출
                    </button>
                </div>

                <!-- 피드백 메시지 -->
                <div id="feedback-msg" class="mt-4 text-center font-bold text-sm hidden py-2 rounded"></div>

            </div>
        </div>

        <!-- 하단 이동 버튼 -->
        <div class="flex justify-between mt-4">
            <button id="prev-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded shadow hover:bg-gray-300 text-sm font-medium transition">⬅️ 이전 절</button>
            <button id="next-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded shadow hover:bg-gray-300 text-sm font-medium transition">다음 절 ➡️</button>
        </div>
    </main>

    <!-- 오답노트 모달 -->
    <div id="note-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg text-rose-600">📝 내 오답노트</h3>
                <button id="close-note" class="text-gray-500 hover:text-black font-bold text-xl">&times;</button>
            </div>
            <div id="note-content" class="p-4 overflow-y-auto flex-1 flex flex-col gap-3 text-sm">
                <!-- 오답 내역 동적 삽입 -->
            </div>
            <div class="p-4 border-t text-right">
                <button id="clear-note" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded hover:bg-red-200 transition">기록 초기화</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 전역 상태 및 데이터 파싱 ---
        let parsedData = {};
        let currentBook = "로마서";
        let currentChapter = "1";
        let versesSet = [];
        let currentSetIndex = 0;
        
        let isRandomMode = false;
        let isMultipleChoice = true;
        let currentBlanks = [];
        let currentChoices = [];
        let distractorPool = [];

        // 불용어 (빈칸 절대 금지)
        const STOPWORDS = [
            "그러므로", "그러나", "이는", "곧", "또한", "이와", "같이", "먼저", "이미", "도리어", "어찌", "더욱", "이제는", 
            "내가", "네가", "너희가", "그들이", "그가", "이것이", "누구든지", "너희도", "그들", "우리", "나", "너", 
            "아멘", "있기를", "원하노라", "함이라", "됨이라", "하노니", "이러므로", "혹은", "무릇", "어떤", "다만", "그리고", "때문에", "위하여"
        ];
        
        const KEYWORDS = [
            "복음", "은혜", "그리스도", "사도", "믿음", "의", "심판", "율법", "긍휼", "사랑", "성령", "구원", 
            "하나님", "예수", "십자가", "영광", "생명", "사망", "진리", "평강", "자비", "거룩", "언약", "지혜",
            "부활", "계시", "화목", "제물", "은사", "소망", "순종", "인내", "기쁨", "찬송", "기업", "육신", "권세"
        ];

        const SEMANTIC_GROUPS = [
            ["구원", "영생", "생명", "속량", "해방", "자유", "거듭남", "화목", "칭의"],
            ["은혜", "긍휼", "자비", "사랑", "평강", "기쁨", "위로", "축복", "영광", "존귀", "능력"],
            ["믿음", "소망", "순종", "인내", "온유", "겸손", "화평", "충성", "열심", "절제"],
            ["복음", "진리", "말씀", "율법", "계명", "교훈", "언약", "약속", "증거", "율례", "규례"],
            ["심판", "진노", "사망", "죄", "불의", "정죄", "멸망", "환난", "고난", "어둠", "허물", "탐욕", "정욕", "악독"],
            ["하나님", "주", "그리스도", "성령", "아버지", "예수", "만유", "조물주", "창조주"],
            ["사도", "선지자", "성도", "제자", "형제", "일꾼", "종", "백성", "자녀", "상속자", "권속"],
            ["유대인", "헬라인", "이방인", "야만인", "할례자", "무할례자", "자유인"],
            ["거룩함", "의로움", "선함", "진실함", "온전함", "경건", "정결", "새로움"],
            ["육신", "육체", "마음", "심령", "생각", "양심", "뜻", "영", "지체", "몸"],
            ["기뻐하고", "감사하고", "찬송하고", "기도하고", "간구하고", "순종하고", "섬기고", "경배하고", "사랑하고"],
            ["비방하는", "수군수군하는", "거역하는", "판단하는", "자랑하는", "속이는", "시기하는", "다투는"]
        ];

        const VERB_ENDINGS = ['하되', '되되', '나니', '거니와', '느니라', '하사', '하며', '하고', '하느니라', '지아니하며', '하리니', '하리라', '시니라', '함이니'];

        function initData() {
            if (typeof BIBLE_DATABASE === 'undefined') {
                alert("bible_data.js 파일을 불러올 수 없습니다. 파일 위치를 확인해주세요.");
                return;
            }
            
            for (const [key, text] of Object.entries(BIBLE_DATABASE)) {
                if (text.trim() === "(없음)") continue;
                
                const match = key.match(/(.+?)\s+(\d+):(.+)/);
                if (match) {
                    const book = match[1];
                    const chapter = match[2];
                    const verse = match[3];
                    
                    if (!parsedData[book]) parsedData[book] = {};
                    if (!parsedData[book][chapter]) parsedData[book][chapter] = [];
                    
                    parsedData[book][chapter].push({ book, chapter, verse, text, key });
                }
            }
            populateBookDropdown();
        }

        // --- 2. UI 컨트롤 바인딩 ---
        function populateBookDropdown() {
            const bookSel = document.getElementById('book-select');
            bookSel.innerHTML = Object.keys(parsedData).map(b => `<option value="${b}">${b}</option>`).join('');
            bookSel.value = currentBook;
            bookSel.addEventListener('change', (e) => {
                currentBook = e.target.value;
                currentChapter = Object.keys(parsedData[currentBook])[0];
                populateChapterDropdown();
            });
            populateChapterDropdown();
        }

        function populateChapterDropdown() {
            const chapSel = document.getElementById('chapter-select');
            const chapters = Object.keys(parsedData[currentBook]).sort((a,b) => parseInt(a) - parseInt(b));
            chapSel.innerHTML = chapters.map(c => `<option value="${c}">${c}장</option>`).join('');
            chapSel.value = currentChapter;
            chapSel.addEventListener('change', (e) => {
                currentChapter = e.target.value;
                loadSet();
            });
            loadSet();
        }

        function populateVerseDropdown() {
            const verseSel = document.getElementById('verse-select');
            const originalVerses = parsedData[currentBook][currentChapter];
            verseSel.innerHTML = originalVerses.map((v, i) => `<option value="${i}">${v.verse}절</option>`).join('');
            
            const currentVerseData = versesSet[currentSetIndex];
            const originalIndex = originalVerses.findIndex(v => v.verse === currentVerseData.verse);
            verseSel.value = originalIndex;

            verseSel.onchange = (e) => {
                const targetVerseStr = originalVerses[e.target.value].verse;
                const setIdx = versesSet.findIndex(v => v.verse === targetVerseStr);
                if(setIdx !== -1) {
                    currentSetIndex = setIdx;
                    renderQuiz();
                }
            };
        }

        function loadSet() {
            versesSet = [...parsedData[currentBook][currentChapter]];
            if (isRandomMode) {
                versesSet.sort(() => Math.random() - 0.5);
            } else {
                versesSet.sort((a, b) => parseInt(a.verse) - parseInt(b.verse));
            }
            distractorPool = generateDistractorPool(versesSet);
            currentSetIndex = 0;
            renderQuiz();
        }

        // --- 3. 핵심 알고리즘 (받침 판별 기능 추가) ---

        // 🌟 한국어 유니코드 기반 종성(받침) 판별 함수
        // 리턴값: 'VOWEL'(받침없음), 'RIEUL'(ㄹ받침 - 로/으로 구분용), 'CONSONANT'(기타 받침)
        function getJongseongType(word) {
            if (!word) return 'VOWEL';
            const lastChar = word.charCodeAt(word.length - 1);
            if (lastChar < 0xAC00 || lastChar > 0xD7A3) return 'VOWEL';
            const jongseongIdx = (lastChar - 0xAC00) % 28;
            
            if (jongseongIdx === 0) return 'VOWEL';
            if (jongseongIdx === 8) return 'RIEUL'; // 'ㄹ' 받침
            return 'CONSONANT';
        }
        
        // 조사 분리 (원래 조사를 훼손하지 않고 그대로 보존)
        function stripParticle(word) {
            const particles = [
                /(은|는)$/, /(이|가)$/, /(을\vert{}를)$/, /(으로|로)$/, /(과\vert{}와)$/, /(에)$/, /(의)$/, /(에게|에게서)$/, /(에서\vert{}부터\vert{}까지)$/
            ];
            for (let r of particles) {
                const match = word.match(r);
                if (match) {
                    const base = word.replace(r, '');
                    // 분리 후 남은 단어가 1글자 이상일 때만 조사 분리 인정
                    if (base.length >= 1) {
                        return { base: base, marker: match[0] };
                    }
                }
            }
            return { base: word, marker: '' };
        }

        // 동사형에서 명사 추출
        function extractNounFromVerb(word) {
            const verbRegex = /^(.+?)(하|되|받|당|롭|스럽)(사|고|며|여|어|아|니|면|자|지|은|는|을|를|음|기|게|다|라|시|신|셔|세|소서|옵|리|나니|거니와|더|던|지라|느니라|옵나이다|심이라|심이니|심으로|심을|시고|시니|시며|하|되|받|롭)*$/;
            const match = word.match(verbRegex);
            
            if (match) {
                const noun = match[1];
                if (noun.length >= 2 || KEYWORDS.includes(noun)) {
                    return { 
                        base: noun, 
                        suffix: word.substring(noun.length) 
                    };
                }
            }
            return null;
        }

        // 오답 풀 생성
        function generateDistractorPool(verses) {
            let pool = [];
            verses.forEach(v => {
                v.text.split(/\s+/).forEach(w => {
                    let clean = w.replace(/[,.?!]/g, '');
                    if (clean.length < 2 || STOPWORDS.includes(clean)) return;
                    
                    let { base, marker } = stripParticle(clean);
                    
                    if (!marker) {
                        const verbExtract = extractNounFromVerb(base);
                        if (verbExtract) {
                            base = verbExtract.base;
                        }
                    }
                    
                    if (base.length >= 1) pool.push(base);
                });
            });
            return [...new Set(pool)];
        }

        // 빈칸 선정
        function selectBlanks(text) {
            const words = text.split(/\s+/).map((w, idx) => ({ original: w, index: idx }));
            
            let candidates = words.filter(w => {
                const clean = w.original.replace(/[^가-힣a-zA-Z0-9]/g, '');
                if (clean.length < 2) return false;
                if (STOPWORDS.includes(clean)) return false;
                return true;
            });

            if (candidates.length < 2) {
                candidates = words.filter(w => w.original.replace(/[^가-힣]/g,'').length >= 1);
            }

            candidates.forEach(c => {
                const clean = c.original.replace(/[^가-힣]/g, '');
                c.score = 0;
                if (KEYWORDS.some(kw => clean.includes(kw))) c.score += 50;
                c.score += clean.length; 
                c.score += Math.random() * 2;
            });

            candidates.sort((a, b) => b.score - a.score);
            
            const blankCount = Math.random() > 0.5 ? 3 : 2;
            let selected = candidates.slice(0, blankCount).sort((a, b) => a.index - b.index);

            return selected.map(s => {
                const match = s.original.match(/^([^,.?!]+)([,.?!]*)$/);
                const wordPart = match ? match[1] : s.original;
                const punctPart = match ? match[2] : "";
                
                let { base, marker } = stripParticle(wordPart);
                let verbSuffix = '';

                if (!marker) {
                    const verbExtract = extractNounFromVerb(base);
                    if (verbExtract) {
                        base = verbExtract.base;
                        verbSuffix = verbExtract.suffix;
                    }
                }

                return {
                    index: s.index,
                    original: s.original,
                    base: base,
                    marker: marker,
                    verbSuffix: verbSuffix,
                    punctuation: punctPart
                };
            });
        }

        // 🌟 유의어 매칭 및 **받침 동기화 필터링**
        function getSimilarWord(targetBase) {
            const targetType = getJongseongType(targetBase);
            
            // 특수 어미 전용 처리
            const matchedEnding = VERB_ENDINGS.find(ending => targetBase.endsWith(ending));
            if (matchedEnding) {
                let exactEndingMatches = distractorPool.filter(w => w !== targetBase && w.endsWith(matchedEnding));
                exactEndingMatches = exactEndingMatches.filter(w => getJongseongType(w) === targetType);
                if (exactEndingMatches.length > 0) {
                    return exactEndingMatches[Math.floor(Math.random() * exactEndingMatches.length)];
                }
            } else {
                for (let group of SEMANTIC_GROUPS) {
                    for (let w of group) {
                        let isMatch = false;
                        
                        if (w.length === 1) {
                            if (targetBase === w) isMatch = true;
                        } else if (targetBase.startsWith(w)) {
                            isMatch = true;
                        }

                        if (isMatch) {
                            const options = group.filter(opt => opt !== w);
                            // 🔥 핵심: 치환한 결과물의 받침이 정답 단어의 받침 구조와 똑같은 단어만 통과시킴
                            const validOptions = options.filter(opt => {
                                const substituted = targetBase.replace(w, opt);
                                return getJongseongType(substituted) === targetType;
                            });

                            if (validOptions.length > 0) {
                                const randomOption = validOptions[Math.floor(Math.random() * validOptions.length)];
                                return targetBase.replace(w, randomOption);
                            }
                        }
                    }
                }
            }

            // 폴백 매칭 시에도 무조건 받침이 동일한 것만 추출
            for (let len of [3, 2, 1]) {
                if (targetBase.length > len) {
                    const suffix = targetBase.slice(-len);
                    let matches = distractorPool.filter(w => w !== targetBase && w.endsWith(suffix));
                    matches = matches.filter(w => getJongseongType(w) === targetType);
                    if (matches.length > 0) {
                        return matches[Math.floor(Math.random() * matches.length)];
                    }
                }
            }

            let similarLengthWords = distractorPool.filter(w => w !== targetBase && Math.abs(w.length - targetBase.length) <= 1);
            similarLengthWords = similarLengthWords.filter(w => getJongseongType(w) === targetType);
            if (similarLengthWords.length > 0) {
                return similarLengthWords[Math.floor(Math.random() * similarLengthWords.length)];
            }

            // 최후의 보루
            if (targetType === 'VOWEL') return "진리";
            return "말씀";
        }

        // 계단식 매력적 오답 생성 알고리즘
        function generateChoices(blanks) {
            const correct = blanks.map(b => b.base);
            let choices = [];
            
            if (blanks.length === 3) {
                choices.push(correct.join(' - '));
                choices.push([correct[0], correct[1], getSimilarWord(correct[2])].join(' - '));
                choices.push([correct[0], getSimilarWord(correct[1]), getSimilarWord(correct[2])].join(' - '));
                choices.push([getSimilarWord(correct[0]), getSimilarWord(correct[1]), getSimilarWord(correct[2])].join(' - '));
            } else {
                choices.push(correct.join(' - '));
                choices.push([correct[0], getSimilarWord(correct[1])].join(' - '));
                choices.push([getSimilarWord(correct[0]), correct[1]].join(' - '));
                choices.push([getSimilarWord(correct[0]), getSimilarWord(correct[1])].join(' - '));
            }

            let uniqueChoices = [...new Set(choices)];
            let safeCounter = 0;
            while(uniqueChoices.length < 4 && safeCounter < 20) {
                safeCounter++;
                let randomChoice = blanks.map(c => getSimilarWord(c.base)).join(' - ');
                if (!uniqueChoices.includes(randomChoice)) {
                    uniqueChoices.push(randomChoice);
                }
            }

            return uniqueChoices.slice(0, 4).map(value => ({ value, sort: Math.random() }))
                .sort((a, b) => a.sort - b.sort)
                .map(({ value }) => value);
        }

        // --- 4. 렌더링 및 인터랙션 ---
        function updateProgress() {
            const fill = document.getElementById('progress-fill');
            const percent = ((currentSetIndex) / versesSet.length) * 100;
            fill.style.width = `${percent}%`;
            populateVerseDropdown();
        }

        function renderQuiz() {
            if (!versesSet || versesSet.length === 0) return;
            
            updateProgress();
            
            const verseData = versesSet[currentSetIndex];
            document.getElementById('verse-title').innerText = verseData.key;
            
            currentBlanks = selectBlanks(verseData.text);
            currentChoices = generateChoices(currentBlanks);
            
            const words = verseData.text.split(/\s+/);
            let html = '';
            
            words.forEach((w, idx) => {
                const blank = currentBlanks.find(b => b.index === idx);
                if (blank) {
                    const blankNum = currentBlanks.indexOf(blank) + 1;
                    let tailHtml = '';
                    
                    // 🌟 이제 중립표기 (은/는)이 아니라 원래 단어의 조사(은, 를 등)를 그대로 자연스럽게 출력!
                    if (blank.verbSuffix) {
                        tailHtml = `<span class="text-gray-800 font-medium text-[0.95em]">${blank.verbSuffix}</span>`;
                    } else if (blank.marker) {
                        tailHtml = `<span class="text-gray-800 font-medium text-[0.95em]">${blank.marker}</span>`;
                    }

                    html += `<span class="inline-block mx-1 font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded border border-indigo-200 shadow-sm align-middle">
                        ①②③④⑤⑥⑦⑧⑨⑩[blankNum-1] <span class="tracking-widest text-transparent">빈칸</span>
                    </span>${tailHtml}${blank.punctuation} `.replace('①②③④⑤⑥⑦⑧⑨⑩[blankNum-1]', ['①','②','③','④','⑤'][blankNum-1]);
                } else {
                    html += w + ' ';
                }
            });
            document.getElementById('verse-text').innerHTML = html;
            
            document.getElementById('feedback-msg').className = 'mt-4 text-center font-bold text-sm hidden py-2 rounded';
            
            if (isMultipleChoice) {
                renderMultipleChoice();
            } else {
                renderSubjective();
            }
        }

        function renderMultipleChoice() {
            document.getElementById('multiple-choice-area').classList.remove('hidden');
            document.getElementById('subjective-area').classList.add('hidden');
            
            const container = document.getElementById('multiple-choice-area');
            const labels = ['a.', 'b.', 'c.', 'd.'];
            
            container.innerHTML = currentChoices.map((choice, i) => `
                <button class="choice-btn text-left p-2 sm:py-2.5 sm:px-4 border border-gray-300 rounded-lg text-sm sm:text-base hover:bg-indigo-50 hover:border-indigo-400 transition bg-white flex gap-2 items-center word-keep" data-answer="${choice}">
                    <span class="font-bold text-indigo-500 w-5">${labels[i]}</span>
                    <span class="flex-1">${choice}</span>
                </button>
            `).join('');

            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    checkAnswer(this.dataset.answer, this);
                });
            });
        }

        function renderSubjective() {
            document.getElementById('multiple-choice-area').classList.add('hidden');
            document.getElementById('subjective-area').classList.remove('hidden');
            
            const container = document.getElementById('subjective-inputs');
            container.innerHTML = currentBlanks.map((b, i) => `
                <div class="flex items-center gap-3">
                    <span class="font-bold text-indigo-600 w-6">${['①','②','③','④'][i]}</span>
                    <input type="text" id="subj-input-${i}" class="flex-1 p-2 border rounded outline-none focus:border-indigo-500 text-sm" placeholder="정답을 입력하세요">
                </div>
            `).join('');
            
            setTimeout(() => document.getElementById('subj-input-0')?.focus(), 50);

            container.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter') checkSubjectiveAnswer();
                });
            });
        }

        // --- 5. 채점 및 오답노트 ---
        function getCorrectString() {
            return currentBlanks.map(b => b.base).join(' - ');
        }

        function showFeedback(isCorrect, element) {
            const msg = document.getElementById('feedback-msg');
            msg.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            
            document.querySelectorAll('.choice-btn, #submit-subjective').forEach(el => el.disabled = true);

            if (isCorrect) {
                msg.classList.add('bg-green-100', 'text-green-700');
                msg.innerText = "🎉 정답입니다!";
                if(element) {
                    element.classList.remove('border-gray-300', 'hover:bg-indigo-50');
                    element.classList.add('bg-green-100', 'border-green-500', 'font-bold');
                }
                setTimeout(() => {
                    nextQuestion();
                }, 800);
            } else {
                msg.classList.add('bg-red-100', 'text-red-700');
                msg.innerText = `❌ 오답입니다. (정답: ${getCorrectString()})`;
                if(element) {
                    element.classList.remove('border-gray-300');
                    element.classList.add('bg-red-50', 'border-red-400');
                }
            }
        }

        function checkAnswer(selectedStr, btnElement) {
            const correctStr = getCorrectString();
            if (selectedStr === correctStr) {
                showFeedback(true, btnElement);
            } else {
                saveToNote(selectedStr, correctStr);
                showFeedback(false, btnElement);
            }
        }

        function checkSubjectiveAnswer() {
            let userAnsArr = [];
            for(let i=0; i<currentBlanks.length; i++) {
                userAnsArr.push(document.getElementById(`subj-input-${i}`).value.trim());
            }
            const selectedStr = userAnsArr.join(' - ');
            const correctStr = getCorrectString();
            
            if (selectedStr.replace(/\s/g,'') === correctStr.replace(/\s/g,'')) {
                showFeedback(true, null);
            } else {
                saveToNote(selectedStr, correctStr);
                showFeedback(false, null);
            }
        }

        document.getElementById('submit-subjective').addEventListener('click', checkSubjectiveAnswer);

        function nextQuestion() {
            if (currentSetIndex < versesSet.length - 1) {
                currentSetIndex++;
                renderQuiz();
            } else {
                alert("현재 장의 모든 퀴즈를 풀었습니다!");
                document.getElementById('progress-fill').style.width = '100%';
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if(currentSetIndex > 0) { currentSetIndex--; renderQuiz(); }
        });
        document.getElementById('next-btn').addEventListener('click', nextQuestion);

        // --- 6. 토글 버튼 및 모달 로직 ---
        const orderBtn = document.getElementById('order-toggle');
        orderBtn.addEventListener('click', () => {
            isRandomMode = !isRandomMode;
            orderBtn.innerText = isRandomMode ? "🔀 랜덤" : "➡️ 순차";
            loadSet();
        });

        const modeBtn = document.getElementById('mode-toggle');
        modeBtn.addEventListener('click', () => {
            isMultipleChoice = !isMultipleChoice;
            modeBtn.innerText = isMultipleChoice ? "4지선다" : "직접입력";
            renderQuiz();
        });

        function saveToNote(wrongVal, correctVal) {
            let notes = JSON.parse(localStorage.getItem('bible_quiz_notes') || '[]');
            const key = versesSet[currentSetIndex].key;
            notes = notes.filter(n => n.key !== key); 
            notes.unshift({
                key: key,
                text: versesSet[currentSetIndex].text,
                wrong: wrongVal,
                correct: correctVal,
                date: new Date().toLocaleString()
            });
            localStorage.setItem('bible_quiz_notes', JSON.stringify(notes));
        }

        function renderNotes() {
            const notes = JSON.parse(localStorage.getItem('bible_quiz_notes') || '[]');
            const container = document.getElementById('note-content');
            if (notes.length === 0) {
                container.innerHTML = "<p class='text-center text-gray-500 py-10'>오답 기록이 없습니다.</p>";
                return;
            }
            container.innerHTML = notes.map(n => `
                <div class="border rounded p-3 bg-white shadow-sm">
                    <div class="flex justify-between border-b pb-1 mb-2">
                        <strong class="text-indigo-600">${n.key}</strong>
                        <span class="text-xs text-gray-400">${n.date}</span>
                    </div>
                    <p class="text-gray-600 text-xs mb-2 word-keep">${n.text}</p>
                    <div class="bg-red-50 p-2 rounded text-xs mb-1">
                        <span class="font-bold text-red-500">내 답안:</span> ${n.wrong || '(빈칸)'}
                    </div>
                    <div class="bg-green-50 p-2 rounded text-xs">
                        <span class="font-bold text-green-600">정답:</span> ${n.correct}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('note-btn').addEventListener('click', () => {
            renderNotes();
            document.getElementById('note-modal').classList.remove('hidden');
            document.getElementById('note-modal').classList.add('flex');
        });
        
        document.getElementById('close-note').addEventListener('click', () => {
            document.getElementById('note-modal').classList.add('hidden');
            document.getElementById('note-modal').classList.remove('flex');
        });

        document.getElementById('clear-note').addEventListener('click', () => {
            if(confirm("모든 오답 기록을 지우시겠습니까?")) {
                localStorage.removeItem('bible_quiz_notes');
                renderNotes();
            }
        });

        window.addEventListener('DOMContentLoaded', initData);

    </script>
</body>
</html>
